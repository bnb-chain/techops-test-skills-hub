name: PR Validate Submission

# Untrusted stage (Job A). Runs in the PR's context, so it gets NO secrets and a
# read-only token. Its only job is to stage the RAW changed skill files plus a
# small PR-context file as a data-only artifact for the privileged workflow_run
# stage to consume. It deliberately does NOT run the project's Node scripts: the
# privileged stage re-parses and re-validates the raw data with trusted main
# code, so nothing the PR author controls (code, deps, parser output) can
# influence the scan.
#
# No path filter: this runs on every PR so the privileged stage can always
# publish the `merge-gate` check (success when no skill files changed), which
# keeps `merge-gate` safely requireable in branch protection without blocking
# unrelated PRs.

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  stage:
    name: Stage submission (Job A)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout PR HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # SHA/number values come from github.event (GitHub-controlled) and are
      # passed via env, never interpolated into the shell directly (C2/M3).
      - name: Detect & stage changed skill files
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p submission
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" \
            | grep -E '^skills/[^/]+-metadata\.json$' \
            | grep -v '^skills/_TEMPLATE-metadata\.json$' > changed-skills.txt || true

          HAS_SKILLS=false
          if [ -s changed-skills.txt ]; then
            HAS_SKILLS=true
            echo "Changed skill files:"; cat changed-skills.txt
            while IFS= read -r f; do
              [ -n "$f" ] && cp "$f" "submission/$(basename "$f")"
            done < changed-skills.txt
          else
            echo "No skill submission files changed."
          fi

          printf '{"pr_number":%s,"head_sha":"%s","has_skills":%s}\n' \
            "$PR_NUMBER" "$HEAD_SHA" "$HAS_SKILLS" > submission/pr-context.json
          echo "Staged submission contents:"; ls -la submission

      - name: Upload submission artifact (raw data only)
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: pr-submission
          path: submission/
          if-no-files-found: error
