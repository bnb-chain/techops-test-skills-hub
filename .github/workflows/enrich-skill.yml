name: Enrich Skill Metadata (post-merge)

# Post-merge persistence only. PR-time validation, scanning and the merge-gate
# live in pr-validate.yml + pr-enrich-scan.yml. After a skill change lands on
# main, this workflow re-enriches it and writes the enriched metadata back via
# the GitHub Contents API (verified commit). Running on `push` to main means it
# is never in a fork context, so secrets are available normally.

on:
  push:
    branches: [main]
    paths:
      - "skills/**-metadata.json"

# Default to no permissions; each job opts in to the least it needs.
permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # Job A — parse-pr. Detects the skill files that changed in the merge commit
  # and emits a data-only artifact for the privileged job to consume.
  # ---------------------------------------------------------------------------
  parse-pr:
    name: Parse & validate submission (Job A)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      any: ${{ steps.detect.outputs.any }}
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Detect changed skill files
        id: detect
        run: |
          git diff --name-only HEAD~1 HEAD \
            | grep -E '^skills/[^/]+-metadata\.json$' \
            | grep -v '^skills/_TEMPLATE-metadata\.json$' > changed-skills.txt || true

          # Skip files that are ALREADY enriched (e.g. legacy submissions that were
          # committed back under the old PR-time flow, re-merges, or manual edits).
          # They have nothing left to persist, and re-validating an enriched file
          # against the strict submission schema would fail. A raw submission has no
          # `evaluated_at` / `agentguard_result` fields.
          : > submissions.txt
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if node -e 'const m=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));process.exit(m.evaluated_at||m.agentguard_result?1:0)' "$f"; then
              echo "$f" >> submissions.txt
            else
              echo "Skipping already-enriched file: $f"
            fi
          done < changed-skills.txt

          if [ ! -s submissions.txt ]; then
            echo "No raw skill submissions to enrich."
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "Submissions to enrich:"; cat submissions.txt
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Parse & validate submissions
        if: steps.detect.outputs.any == 'true'
        env:
          PARSED_DIR: parsed
        run: |
          xargs -a submissions.txt node scripts/parse-submission.js

      - name: Upload parsed artifact (data only)
        if: steps.detect.outputs.any == 'true'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: parsed-skills
          path: parsed/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Job B — enrich. Enriches the data-only artifact and re-runs the AgentGuard
  # scan as defense-in-depth before persisting.
  # ---------------------------------------------------------------------------
  enrich:
    name: Enrich & scan (Job B)
    needs: parse-pr
    if: needs.parse-pr.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      gate: ${{ steps.gate.outputs.gate }}
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Download parsed artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: parsed-skills
          path: parsed/

      - name: Enrich & scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENTGUARD_API_KEY: ${{ secrets.AGENTGUARD_API_KEY }}
          ENRICHED_DIR: enriched
        run: |
          node scripts/enrich-skill.js parsed/*.json

      - name: Evaluate scan result (record, non-blocking)
        id: gate
        run: |
          # Post-merge the change is already on main, so this stage does NOT block
          # — the PR-time merge-gate (pr-enrich-scan.yml) is the enforcement point.
          # Here we RECORD the verdict: the enriched metadata (including a failed
          # verdict) is persisted by Job C, and Job D opens a tracking issue when
          # the verdict is non-passing, so a flagged skill that was merged anyway
          # is surfaced for review rather than silently turning the run red.
          if node scripts/check-merge-gate.js enriched/*.json; then
            echo "gate=pass" >> "$GITHUB_OUTPUT"
          else
            echo "gate=fail" >> "$GITHUB_OUTPUT"
            echo "::warning::AgentGuard did not pass for one or more merged skills; recording the result and flagging for review."
          fi

      - name: Upload enriched artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: enriched-skills
          path: enriched/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Job C — commit-back. Writes the enriched metadata to main through the GitHub
  # Contents API (commits are GitHub-signed/verified, satisfying the signed-
  # commit ruleset). Idempotent: skips when content is unchanged. Runs for every
  # verdict so that main always records the actual scan result (including a
  # `failed` verdict for a skill that was merged despite the PR-time gate).
  # ---------------------------------------------------------------------------
  commit-back:
    name: Commit back (Job C)
    needs: enrich
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download enriched artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: enriched-skills
          path: enriched/

      - name: Commit enriched files to main (verified, via API)
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const branch = process.env.TARGET_BRANCH;
            const { owner, repo } = context.repo;

            const enrichedFiles = fs.readdirSync('enriched').filter((f) => f.endsWith('.json'));
            for (const file of enrichedFiles) {
              const id = path.basename(file, '.json');
              const repoPath = `skills/${id}-metadata.json`;
              const contentB64 = fs.readFileSync(path.join('enriched', file)).toString('base64');

              // Look up the existing file to get its blob SHA (required for updates)
              // and to short-circuit when the enriched content is unchanged.
              let sha;
              try {
                const { data } = await github.rest.repos.getContent({ owner, repo, path: repoPath, ref: branch });
                sha = data.sha;
                if (data.content && data.content.replace(/\n/g, '') === contentB64) {
                  core.info(`No change for ${repoPath} on ${branch}; skipping.`);
                  continue;
                }
              } catch (err) {
                if (err.status !== 404) throw err;
              }

              await github.rest.repos.createOrUpdateFileContents({
                owner,
                repo,
                path: repoPath,
                branch,
                message: `chore: enrich skill metadata (${id})`,
                content: contentB64,
                sha,
              });
              core.info(`Committed verified enriched metadata for ${repoPath} on ${branch}.`);
            }

  # ---------------------------------------------------------------------------
  # Job D — flag-scan. When the recorded verdict is non-passing (a flagged skill
  # was merged anyway), open a deduplicated tracking issue with the verdict and
  # AgentGuard report link so maintainers can review/remediate. Runs only when
  # Job B recorded a failing gate; needs only `issues: write`.
  # ---------------------------------------------------------------------------
  flag-scan:
    name: Flag failed scan (Job D)
    needs: enrich
    if: needs.enrich.outputs.gate == 'fail'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Download enriched artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: enriched-skills
          path: enriched/

      - name: Open tracking issue for non-passing skills
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const { owner, repo } = context.repo;

            const dir = 'enriched';
            const files = fs.readdirSync(dir).filter((f) => f.endsWith('.json'));
            for (const file of files) {
              const m = JSON.parse(fs.readFileSync(path.join(dir, file), 'utf8'));
              const result = m.agentguard_result;
              const verdict = result && typeof result.verdict === 'string' ? result.verdict : 'unknown';
              if (verdict === 'passed') continue;

              const id = path.basename(file, '.json');
              const name = m.name || id;
              const report = m.agentguard_report_url || null;
              // Stable marker so re-runs don't open duplicate issues for the same skill.
              const marker = `<!-- skill-scan:${id} -->`;

              const existing = await github.rest.search.issuesAndPullRequests({
                q: `repo:${owner}/${repo} is:issue is:open in:body "${marker}"`,
              });
              if (existing.data.total_count > 0) {
                core.info(`Tracking issue already open for ${id}; skipping.`);
                continue;
              }

              const body = [
                marker,
                '',
                'AgentGuard returned a **non-passing** verdict for a skill that was merged into `main`.',
                '',
                `- **Skill:** ${name}`,
                `- **Metadata:** \`skills/${id}-metadata.json\``,
                `- **Verdict:** \`${verdict}\``,
                report ? `- **Report:** ${report}` : '- **Report:** (none returned)',
                '',
                'The enriched metadata (including this verdict) has been recorded on `main`. ' +
                  'Please review the report and remediate or remove the skill.',
              ].join('\n');

              await github.rest.issues.create({
                owner,
                repo,
                title: `Skill scan flagged: ${name} (${verdict})`,
                body,
              });
              core.info(`Opened tracking issue for ${id} (${verdict}).`);
            }
