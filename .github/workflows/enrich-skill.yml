name: Enrich Skill Metadata (post-merge)

# Post-merge persistence only. PR-time validation, scanning and the merge-gate
# live in pr-validate.yml + pr-enrich-scan.yml. After a skill change lands on
# main, this workflow re-enriches it and writes the enriched metadata back via
# the GitHub Contents API (verified commit). Running on `push` to main means it
# is never in a fork context, so secrets are available normally.

on:
  push:
    branches: [main]
    paths:
      - "skills/**-metadata.json"

# Default to no permissions; each job opts in to the least it needs.
permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # Job A — parse-pr. Detects the skill files that changed in the merge commit
  # and emits a data-only artifact for the privileged job to consume.
  # ---------------------------------------------------------------------------
  parse-pr:
    name: Parse & validate submission (Job A)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      any: ${{ steps.detect.outputs.any }}
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Detect changed skill files
        id: detect
        run: |
          git diff --name-only HEAD~1 HEAD \
            | grep -E '^skills/[^/]+-metadata\.json$' \
            | grep -v '^skills/_TEMPLATE-metadata\.json$' > changed-skills.txt || true

          # Skip files that are ALREADY enriched (e.g. legacy submissions that were
          # committed back under the old PR-time flow, re-merges, or manual edits).
          # They have nothing left to persist, and re-validating an enriched file
          # against the strict submission schema would fail. A raw submission has no
          # `evaluated_at` / `agentguard_result` fields.
          : > submissions.txt
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if node -e 'const m=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8"));process.exit(m.evaluated_at||m.agentguard_result?1:0)' "$f"; then
              echo "$f" >> submissions.txt
            else
              echo "Skipping already-enriched file: $f"
            fi
          done < changed-skills.txt

          if [ ! -s submissions.txt ]; then
            echo "No raw skill submissions to enrich."
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "Submissions to enrich:"; cat submissions.txt
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Parse & validate submissions
        if: steps.detect.outputs.any == 'true'
        env:
          PARSED_DIR: parsed
        run: |
          xargs -a submissions.txt node scripts/parse-submission.js

      - name: Upload parsed artifact (data only)
        if: steps.detect.outputs.any == 'true'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: parsed-skills
          path: parsed/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Job B — enrich. Enriches the data-only artifact and re-runs the AgentGuard
  # scan as defense-in-depth before persisting.
  # ---------------------------------------------------------------------------
  enrich:
    name: Enrich & scan (Job B)
    needs: parse-pr
    if: needs.parse-pr.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Download parsed artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: parsed-skills
          path: parsed/

      - name: Enrich & scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENTGUARD_API_KEY: ${{ secrets.AGENTGUARD_API_KEY }}
          ENRICHED_DIR: enriched
        run: |
          node scripts/enrich-skill.js parsed/*.json

      - name: Merge gate (AgentGuard must pass)
        run: |
          node scripts/check-merge-gate.js enriched/*.json

      - name: Upload enriched artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: enriched-skills
          path: enriched/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Job C — commit-back. Writes the enriched metadata to main through the GitHub
  # Contents API (commits are GitHub-signed/verified, satisfying the signed-
  # commit ruleset). Idempotent: skips when content is unchanged.
  # ---------------------------------------------------------------------------
  commit-back:
    name: Commit back (Job C)
    needs: enrich
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download enriched artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: enriched-skills
          path: enriched/

      - name: Commit enriched files to main (verified, via API)
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const branch = process.env.TARGET_BRANCH;
            const { owner, repo } = context.repo;

            const enrichedFiles = fs.readdirSync('enriched').filter((f) => f.endsWith('.json'));
            for (const file of enrichedFiles) {
              const id = path.basename(file, '.json');
              const repoPath = `skills/${id}-metadata.json`;
              const contentB64 = fs.readFileSync(path.join('enriched', file)).toString('base64');

              // Look up the existing file to get its blob SHA (required for updates)
              // and to short-circuit when the enriched content is unchanged.
              let sha;
              try {
                const { data } = await github.rest.repos.getContent({ owner, repo, path: repoPath, ref: branch });
                sha = data.sha;
                if (data.content && data.content.replace(/\n/g, '') === contentB64) {
                  core.info(`No change for ${repoPath} on ${branch}; skipping.`);
                  continue;
                }
              } catch (err) {
                if (err.status !== 404) throw err;
              }

              await github.rest.repos.createOrUpdateFileContents({
                owner,
                repo,
                path: repoPath,
                branch,
                message: `chore: enrich skill metadata (${id})`,
                content: contentB64,
                sha,
              });
              core.info(`Committed verified enriched metadata for ${repoPath} on ${branch}.`);
            }
