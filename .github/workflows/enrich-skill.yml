name: Enrich Skill Metadata

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "skills/**-metadata.json"
  push:
    branches: [main]
    paths:
      - "skills/**-metadata.json"

# Default to no permissions; each job opts in to the least it needs (C1, C3).
permissions: {}

jobs:
  # ---------------------------------------------------------------------------
  # Job A — parse-pr (LOW privilege). Runs the PR-checked-out code, but with NO
  # secrets and read-only token, so PR-supplied code can never exfiltrate a
  # secret (C1). Validates each submission against the strict v1 schema and
  # emits a DATA-ONLY artifact for the privileged job to consume.
  # ---------------------------------------------------------------------------
  parse-pr:
    name: Parse & validate submission (Job A)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      any: ${{ steps.detect.outputs.any }}
    steps:
      - name: Checkout PR HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      # Branch/SHA values are passed via env and quoted in shell to avoid
      # template injection (C2, M3). The file list goes to a temp file, never
      # interpolated into another command.
      - name: Detect changed skill files
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -E '^skills/[^/]+-metadata\.json$' || true)
          else
            FILES=$(git diff --name-only HEAD~1 HEAD | grep -E '^skills/[^/]+-metadata\.json$' || true)
          fi
          # Never enrich the template itself.
          FILES=$(printf '%s\n' "$FILES" | grep -v '^skills/_TEMPLATE-metadata\.json$' || true)

          if [ -z "$FILES" ]; then
            echo "No skill submission files changed."
            echo "any=false" >> "$GITHUB_OUTPUT"
          else
            echo "Changed files:"; printf '%s\n' "$FILES"
            printf '%s\n' "$FILES" > changed-skills.txt
            echo "any=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Parse & validate submissions
        if: steps.detect.outputs.any == 'true'
        env:
          PARSED_DIR: parsed
        run: |
          xargs -a changed-skills.txt node scripts/parse-submission.js

      - name: Upload parsed artifact (data only)
        if: steps.detect.outputs.any == 'true'
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: parsed-skills
          path: parsed/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Job B — enrich (PRIVILEGED). Runs ONLY the main-branch code (checked out at
  # base.sha), never the PR's copy of the scripts, then enriches the data-only
  # artifact and runs the AgentGuard scan. The merge-gate check is published
  # here: check-merge-gate.js exits non-zero unless every skill passed.
  # ---------------------------------------------------------------------------
  enrich:
    name: Enrich & scan (Job B)
    needs: parse-pr
    if: needs.parse-pr.outputs.any == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout main (NOT the PR) at the base commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm ci

      - name: Download parsed artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: parsed-skills
          path: parsed/

      - name: Enrich & scan
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AGENTGUARD_API_KEY: ${{ secrets.AGENTGUARD_API_KEY }}
          ENRICHED_DIR: enriched
        run: |
          node scripts/enrich-skill.js parsed/*.json

      # Security boundary (C3): branch protection requires this `enrich` check.
      # It is green only when AgentGuard returned `passed` for every skill.
      - name: Merge gate (AgentGuard must pass)
        run: |
          node scripts/check-merge-gate.js enriched/*.json

      - name: Upload enriched artifact
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: enriched-skills
          path: enriched/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Job C — commit-back (PRIVILEGED WRITE). Runs main-branch code, downloads the
  # enriched artifact, writes it into the skill files and pushes. The branch
  # name is passed via env and quoted in shell (C2). Posts one consolidated PR
  # comment rendered by the sanitized renderer (M2).
  # ---------------------------------------------------------------------------
  commit-back:
    name: Commit back & comment (Job C)
    needs: enrich
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout target branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # Same-repo PR: push to the PR branch. Push event: stay on main.
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"

      - name: Download enriched artifact
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: enriched-skills
          path: enriched/

      - name: Write enriched metadata into skill files
        run: |
          for f in enriched/*.json; do
            id=$(basename "$f" .json)
            cp "$f" "skills/${id}-metadata.json"
          done

      - name: Commit & push enriched files
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add skills/
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: enrich skill metadata"
          git push origin "HEAD:$BRANCH"

      - name: Commit enriched files to main (post-merge / push)
        if: github.event_name == 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add skills/
          git diff --staged --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: enrich skill metadata"
          git push origin HEAD:main

      - name: Render PR comment body
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
        run: |
          node scripts/render-comment.js enriched/*.json > comment-body.md

      - name: Post enrichment comment
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork == false
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('comment-body.md', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });
